name: CI

on:
  push:
    branches: [main, connectors]
  pull_request:
    branches: [main, connectors]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  demo-failure:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Simulate deployment step
        run: echo "Checking deployment readiness..."

      - name: Verify pod health
        run: |
          echo "ERROR: catalog-api pods not ready"
          echo "Pod catalog-api-5f86594b59-qvcpc has 3 restarts in last 5 minutes"
          echo "Expected: all pods in Running state with 0 restarts"
          exit 1
