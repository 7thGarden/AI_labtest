remoteWrite:
  - url: http://victoriametrics-victoria-metrics-single-server.observability.svc.cluster.local:8428/api/v1/write

config:
  global:
    scrape_interval: 15s

  scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod

    - job_name: catalog-api
      metrics_path: /metrics
      static_configs:
        - targets:
            - catalog-api.opensre.svc.cluster.local:8000
