admin:
  password: admin123

service:
  type: ClusterIP
  port: 80

grafana.ini:
  server:
    root_url: http://localhost:3000
    allow_embedding: true
  auth.anonymous:
    enabled: true
    org_role: Viewer
  security:
    allow_embedding: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics-victoria-metrics-single-server.observability.svc.cluster.local:8428
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    opensre-overview:
      json: |
        {
          "annotations": {
            "list": []
          },
          "editable": true,
          "refresh": "5s",
          "schemaVersion": 39,
          "version": 1,
          "timezone": "browser",
          "time": {
            "from": "now-15m",
            "to": "now"
          },
          "title": "OpenSRE Cluster & Pod Overview",
          "uid": "opensre-overview",
          "templating": {
            "list": [
              {
                "name": "instance",
                "type": "query",
                "label": "Instance / Target",
                "query": {
                  "query": "label_values(up, instance)",
                  "refId": "instance"
                },
                "refresh": 2,
                "includeAll": true,
                "allValue": ".*",
                "multi": true,
                "hide": 0
              },
              {
                "name": "pod",
                "type": "query",
                "label": "Pod",
                "query": {
                  "query": "label_values(up, pod)",
                  "refId": "pod"
                },
                "refresh": 2,
                "includeAll": true,
                "allValue": ".*",
                "multi": true,
                "hide": 0
              },
              {
                "name": "node",
                "type": "query",
                "label": "Node",
                "query": {
                  "query": "label_values(up, node)",
                  "refId": "node"
                },
                "refresh": 2,
                "includeAll": true,
                "allValue": ".*",
                "multi": true,
                "hide": 0
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Up Targets",
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "expr": "count(up{instance=~\"$instance\",pod=~\"$pod\",node=~\"$node\"} == 1)",
                  "legendFormat": "up",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": 0
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": false
                }
              }
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Total Requests",
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 4,
                "y": 0
              },
              "targets": [
                {
                  "expr": "sum(http_requests_total{instance=~\"$instance\",pod=~\"$pod\"})",
                  "legendFormat": "total",
                  "refId": "A"
                }
              ],
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": false
                }
              }
            },
            {
              "id": 3,
              "type": "stat",
              "title": "Request Rate (req/s)",
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 8,
                "y": 0
              },
              "targets": [
                {
                  "expr": "sum(rate(http_requests_total{instance=~\"$instance\",pod=~\"$pod\"}[$__rate_interval]))",
                  "legendFormat": "rps",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": false
                }
              }
            },
            {
              "id": 4,
              "type": "stat",
              "title": "Error Rate (5xx/s)",
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "expr": "sum(rate(http_requests_total{instance=~\"$instance\",pod=~\"$pod\",status=~\"5..\"}[$__rate_interval]))",
                  "legendFormat": "errors/s",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "color": {
                    "mode": "thresholds"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green",
                        "value": 0
                      },
                      {
                        "color": "yellow",
                        "value": 1
                      },
                      {
                        "color": "red",
                        "value": 5
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": false
                }
              }
            },
            {
              "id": 5,
              "type": "stat",
              "title": "Avg Response Size (bytes)",
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 16,
                "y": 0
              },
              "targets": [
                {
                  "expr": "sum(http_response_size_bytes_sum{instance=~\"$instance\",pod=~\"$pod\"}) / sum(http_response_size_bytes_count{instance=~\"$instance\",pod=~\"$pod\"})",
                  "legendFormat": "avg bytes",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "decbytes"
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": false
                }
              }
            },
            {
              "id": 6,
              "type": "stat",
              "title": "Process Memory (RSS)",
              "gridPos": {
                "h": 4,
                "w": 4,
                "x": 20,
                "y": 0
              },
              "targets": [
                {
                  "expr": "max(process_resident_memory_bytes{instance=~\"$instance\",pod=~\"$pod\"})",
                  "legendFormat": "rss",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes"
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "values": false
                }
              }
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Process CPU Usage",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 4
              },
              "targets": [
                {
                  "expr": "sum by (pod, instance) (rate(process_cpu_seconds_total{instance=~\"$instance\",pod=~\"$pod\"}[$__rate_interval]))",
                  "legendFormat": "{{pod}} {{instance}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit"
                }
              }
            },
            {
              "id": 8,
              "type": "timeseries",
              "title": "Resident Memory",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 4
              },
              "targets": [
                {
                  "expr": "sum by (pod, instance) (process_resident_memory_bytes{instance=~\"$instance\",pod=~\"$pod\"})",
                  "legendFormat": "{{pod}} {{instance}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes"
                }
              }
            },
            {
              "id": 9,
              "type": "timeseries",
              "title": "Request Rate by Handler",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 12
              },
              "targets": [
                {
                  "expr": "sum by (handler, method) (rate(http_requests_total{instance=~\"$instance\",pod=~\"$pod\"}[$__rate_interval]))",
                  "legendFormat": "{{method}} {{handler}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                }
              }
            },
            {
              "id": 10,
              "type": "timeseries",
              "title": "Request Rate by Status",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 12
              },
              "targets": [
                {
                  "expr": "sum by (status) (rate(http_requests_total{instance=~\"$instance\",pod=~\"$pod\"}[$__rate_interval]))",
                  "legendFormat": "{{status}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                }
              }
            },
            {
              "id": 11,
              "type": "timeseries",
              "title": "Request Latency (p95)",
              "gridPos": {
                "h": 8,
                "w": 24,
                "x": 0,
                "y": 20
              },
              "targets": [
                {
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{instance=~\"$instance\",pod=~\"$pod\"}[$__rate_interval])))",
                  "legendFormat": "p95",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                }
              }
            },
            {
              "id": 12,
              "type": "timeseries",
              "title": "Response Throughput (bytes/s)",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 28
              },
              "targets": [
                {
                  "expr": "sum by (instance, pod) (rate(http_response_size_bytes_sum{instance=~\"$instance\",pod=~\"$pod\"}[$__rate_interval]))",
                  "legendFormat": "{{pod}} {{instance}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "Bps"
                }
              }
            },
            {
              "id": 13,
              "type": "timeseries",
              "title": "Python GC Objects Collected",
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 28
              },
              "targets": [
                {
                  "expr": "sum by (pod, instance) (rate(python_gc_objects_collected{instance=~\"$instance\",pod=~\"$pod\"}[$__rate_interval]))",
                  "legendFormat": "{{pod}} {{instance}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "ops"
                }
              }
            }
          ]
        }