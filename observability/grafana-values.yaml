admin:
  password: admin123

service:
  type: ClusterIP
  port: 80

grafana.ini:
  server:
    root_url: http://localhost:3000
    allow_embedding: true
  auth.anonymous:
    enabled: true
    org_role: Viewer
  security:
    allow_embedding: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics-victoria-metrics-single-server.observability.svc.cluster.local:8428
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    catalog-api-overview:
      json: |
        {
          "annotations": { "list": [] },
          "editable": true,
          "refresh": "5s",
          "schemaVersion": 39,
          "version": 1,
          "timezone": "browser",
          "time": { "from": "now-15m", "to": "now" },
          "templating": { "list": [] },
          "title": "Catalog API Overview",
          "uid": "catalog-api-overview",
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Catalog API Pods Up",
              "gridPos": { "h": 6, "w": 4, "x": 0, "y": 0 },
              "targets": [ { "expr": "sum(up{job=\"catalog-api\"})", "legendFormat": "pods up", "refId": "A" } ],
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false, "limit": 20 } }
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Total Requests",
              "gridPos": { "h": 6, "w": 4, "x": 4, "y": 0 },
              "targets": [ { "expr": "sum(http_requests_total{job=\"catalog-api\"})", "legendFormat": "requests", "refId": "A" } ],
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } }
            },
            {
              "id": 3,
              "type": "stat",
              "title": "Request Rate (req/s)",
              "gridPos": { "h": 6, "w": 4, "x": 8, "y": 0 },
              "targets": [ { "expr": "sum(rate(http_requests_total{job=\"catalog-api\"}[$__rate_interval]))", "legendFormat": "rps", "refId": "A" } ],
              "options": { "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } }
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Requests by Handler",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
              "targets": [ { "expr": "sum by (handler, method) (rate(http_requests_total{job=\"catalog-api\"}[$__rate_interval]))", "legendFormat": "{{method}} {{handler}}", "refId": "A" } ],
              "fieldConfig": { "defaults": { "unit": "reqps" } }
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Requests by Status",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
              "targets": [ { "expr": "sum by (status) (rate(http_requests_total{job=\"catalog-api\"}[$__rate_interval]))", "legendFormat": "{{status}}", "refId": "A" } ],
              "fieldConfig": { "defaults": { "unit": "reqps" } }
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Request Latency (p95)",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
              "targets": [ { "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{job=\"catalog-api\"}[$__rate_interval])))", "legendFormat": "p95 {{handler}}", "refId": "A" } ],
              "fieldConfig": { "defaults": { "unit": "s" } }
            }
          ]
        }
