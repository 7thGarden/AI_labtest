# Kibana values for OpenSRE demo — no TLS

# Connect to ES over plain HTTP
elasticsearchHosts: "http://opensre-es-master:9200"

# No TLS to ES
elasticsearch.ssl.verificationMode: none

# Health check
healthCheckPath: "/api/status"

# Service
service:
  type: NodePort
  nodePort: 30001

# Disable TLS cert creation
createCert: false

# Remove cert volume mounts
extraVolumes: []
extraVolumeMounts: []

# Don't look for cert secrets
certificatesSecret: ""
