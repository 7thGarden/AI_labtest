version: '3.8'

services:
  yugabyte:
    image: yugabytedb/yugabyte:latest
    container_name: yugabyte
    ports:
      - "5433:5433"   # YSQL API (PostgreSQL compatible)
      - "7000:7000"   # Master UI
      - "9000:9000"   # TServer UI
      - "9042:9042"   # YCQL API
    command: ["bin/yugabyted", "start", "--daemon=false", "--listen=0.0.0.0"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5433", "-U", "yugabyte", "-d", "yugabyte"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - opensre-network

  aerospike:
    image: aerospike/aerospike-server:latest
    container_name: aerospike
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "asinfo", "-v", "build"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - opensre-network

networks:
  opensre-network:
    driver: bridge