apiVersion: apps/v1
kind: Deployment

metadata:
  name: flaky-service
  namespace: opensre

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flaky-service

  template:
    metadata:
      labels:
        app: flaky-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"

    spec:
      containers:
        - name: flaky-service
          image: localhost/flaky-service:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service

metadata:
  name: flaky-service
  namespace: opensre

spec:
  selector:
    app: flaky-service

  ports:
    - port: 8000
      targetPort: 8000

  type: ClusterIP