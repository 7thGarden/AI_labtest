apiVersion: apps/v1
kind: Deployment

metadata:
  name: traffic-gen
  namespace: opensre

spec:
  replicas: 1

  selector:
    matchLabels:
      app: traffic-gen

  template:
    metadata:
      labels:
        app: traffic-gen
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"

    spec:
      containers:
        - name: traffic-gen
          image: docker.io/curlimages/curl:8.9.1
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
            - |
              CATALOG=http://catalog-api.opensre.svc.cluster.local:8000
              FLAKY=http://flaky-service.opensre.svc.cluster.local:8000
              while true; do
                # steady healthy catalog traffic
                curl -s -o /dev/null $CATALOG/products
                curl -s -o /dev/null $CATALOG/products
                curl -s -o /dev/null $CATALOG/health
                # probe sidecar in-pod traffic (generates probe latency samples)
                curl -s -o /dev/null http://localhost:8000/probe
                curl -s -o /dev/null http://localhost:8000/probe
                # order service traffic (mix of 200/500)
                curl -s -o /dev/null $FLAKY/orders
                curl -s -o /dev/null $FLAKY/orders
                sleep 0.3
                # occasional latency spike (concurrent slow calls)
                for i in 1 2 3; do
                  curl -s -o /dev/null $FLAKY/slow &
                done
                wait
                sleep 1.5
              done

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi

        - name: probe
          image: localhost/probe:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi